<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arctic Drift - Teal & White Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #004d4d; /* Deep Teal */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }
        h1 {
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #e6ffff; /* Ice White */
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 4px solid #ffffff;
            border-radius: 8px;
        }
        canvas {
            background-color: #006666; /* Vibrant Teal Ocean */
            display: block;
        }
        #uiOverlay {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,77,77,0.5);
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 77, 77, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
        }
        .btn {
            background: #ffffff;
            color: #006666;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #e6ffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>ARCTIC DRIFT</h1>
    
    <div id="gameContainer">
        <div id="uiOverlay">Score: <span id="scoreVal">0</span></div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="gameOverScreen">
            <h2 style="font-size: 40px; color: #ffffff;">Game Over</h2>
            <p style="margin-top: 10px; color: #e6ffff;">The ice trapped the seal!</p>
            <p style="font-size: 22px; margin-top: 15px;">Final Score: <span id="finalScore">0</span></p>
            <button class="btn" onclick="resetGame()">Swim Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');

        let gameActive = true;
        let score = 0;
        let obstacles = [];
        let items = [];
        let spawnTimer = 0;

        // Player (The White Seal)
        const player = {
            x: 100,
            y: 250,
            radius: 15,
            color: '#ffffff',
            targetY: 250,
            speed: 0.1 // Smooth interpolation factor
        };

        // Track mouse movement
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.targetY = e.clientY - rect.top;
        });

        // Track touch movement for mobile
        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.targetY = e.touches[0].clientY - rect.top;
            e.preventDefault();
        }, { passive: false });

        class Obstacle {
            constructor() {
                this.x = canvas.width + 50;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 30 + 20;
                this.speed = Math.random() * 3 + 2 + (score * 0.1);
                this.color = '#003333'; // Dark Teal Iceberg
            }
            update() {
                this.x -= this.speed;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                // Iceberg highlight border
                ctx.strokeStyle = '#004d4d';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.closePath();
            }
        }

        class Item {
            constructor() {
                this.x = canvas.width + 30;
                this.y = Math.random() * (canvas.height - 40) + 20;
                this.radius = 8;
                this.speed = 3;
                this.color = '#e6ffff'; // Radiant White Pearl
            }
            update() {
                this.x -= this.speed;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                // Glowing effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffffff';
                ctx.closePath();
                ctx.shadowBlur = 0; // Reset shadow
            }
        }

        function spawnEntities() {
            spawnTimer++;
            if (spawnTimer % 45 === 0) {
                obstacles.push(new Obstacle());
            }
            if (spawnTimer % 75 === 0) {
                items.push(new Item());
            }
        }

        function checkCollision(circle1, circle2) {
            const dx = circle1.x - circle2.x;
            const dy = circle1.y - circle2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < circle1.radius + circle2.radius;
        }

        function update() {
            if (!gameActive) return;

            // Smooth player movement towards target
            player.y += (player.targetY - player.y) * player.speed;
            
            // Keep player inside canvas boundaries
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;

            spawnEntities();

            // Handle Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                if (checkCollision(player, obstacles[i])) {
                    endGame();
                }
                if (obstacles[i].x + obstacles[i].radius < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Handle Items
            for (let i = items.length - 1; i >= 0; i--) {
                items[i].update();
                if (checkCollision(player, items[i])) {
                    score += 10;
                    scoreVal.textContent = score;
                    items.splice(i, 1);
                    continue;
                }
                if (items[i].x + items[i].radius < 0) {
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            // Clear screen with a subtle ocean gradient background
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#006666');
            grad.addColorStop(1, '#004d4d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Items
            items.forEach(item => item.draw());

            // Draw Obstacles
            obstacles.forEach(obs => obs.draw());

            // Draw Player (Seal)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            // Tiny tail detail
            ctx.moveTo(player.x - 12, player.y);
            ctx.lineTo(player.x - 22, player.y - 7);
            ctx.lineTo(player.x - 22, player.y + 7);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.closePath();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameActive = false;
            finalScore.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            scoreVal.textContent = score;
            obstacles = [];
            items = [];
            player.y = 250;
            player.targetY = 250;
            gameOverScreen.style.display = 'none';
            gameActive = true;
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
